name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate scripts and manifests
        run: |
          bash -n scripts/*.sh
          node -e "for (const file of ['package.json','package-lock.json','tsconfig.json','.codex-plugin/plugin.json']) JSON.parse(require('fs').readFileSync(file, 'utf8'))"
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Check
        run: npm run check | tee ci-log.txt
      - name: Upload diagnostic log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci-log.txt
      - run: npm run build
      - name: Validate package contents
        run: npm pack --dry-run
