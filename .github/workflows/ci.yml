name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Check
        run: npm run check > ci-log.txt 2>&1
      - name: Upload diagnostic log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-log
          path: ci-log.txt
      - run: npm run build
