name: Bootstrap project payload

on:
  push:
    branches: [feat/cachyos-computer-mcp]
    paths:
      - .bootstrap/chunk-*
      - .github/workflows/bootstrap.yml
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cachyos-computer-mcp
          fetch-depth: 0
      - name: Verify and extract project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | base64 --decode > /tmp/mcp-free.tar.gz
          echo '8ac68a02e1d96d239be7afd458dd8cd266636c87cf43db5db42d8d5cad82d1ba  /tmp/mcp-free.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/mcp-free.tar.gz
          chmod +x scripts/*.sh
          rm -rf .bootstrap .github/workflows/bootstrap.yml
      - name: Commit expanded repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add CachyOS computer-control MCP'
          git push origin HEAD:feat/cachyos-computer-mcp
